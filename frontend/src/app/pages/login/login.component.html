<div class="container mt-5" style="min-height: 60vh;">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card shadow border-0">
        <div class="card-body p-4">
          <h3 class="text-center mb-4 text-primary fw-bold">Acceso Intranet Médico</h3>
          
          <div class="mb-3">
            <label class="form-label fw-bold">Usuario</label>
            <input type="text" class="form-control" [(ngModel)]="usuario" placeholder="Ej. admin">
          </div>

          <div class="mb-3">
            <label class="form-label fw-bold">Contraseña</label>
            <input type="password" class="form-control" [(ngModel)]="password" placeholder="Ej. 123456">
          </div>

          <div *ngIf="mensajeError" class="alert alert-danger py-2">
            {{ mensajeError }}
          </div>

          <button class="btn btn-primary w-100 py-2 fw-bold mt-2" (click)="login()" [disabled]="cargando">
            {{ cargando ? 'Verificando...' : 'Ingresar' }}
          </button>
          
          <div class="text-center mt-3 text-muted small">
            Dato de prueba: <b>admin</b> / <b>123456</b>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
