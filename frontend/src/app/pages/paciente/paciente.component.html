<div class="container mt-5" style="min-height: 60vh;">
  <div class="row justify-content-center">
    <div class="col-md-6 text-center">
      <h2 class="fw-bold text-primary mb-4">Portal de Resultados Clínicos</h2>
      <div class="card shadow border-0">
        <div class="card-body p-5">
          <p class="text-muted">Ingresa tu número de DNI (7 dígitos) para descargar tu último examen médico.</p>
          <div class="input-group mb-3">
            <input type="text" class="form-control form-control-lg" [(ngModel)]="dni" placeholder="Ej. 1234567" maxlength="7">
            <button class="btn btn-primary px-4" (click)="buscarExamen()" [disabled]="cargando">
              <span *ngIf="!cargando">Buscar</span>
              <span *ngIf="cargando">⏳</span>
            </button>
          </div>

          <div *ngIf="resultado" class="alert alert-success text-start mt-4">
            <h5 class="alert-heading">¡Examen Encontrado!</h5>
            <p class="mb-0">Documento asociado al DNI: {{dni}}</p>
            <hr>
            <a [href]="resultado.url" target="_blank" class="btn btn-success w-100 fw-bold">📥 Descargar Documento</a>
          </div>

          <div *ngIf="mensajeError" class="alert alert-warning mt-4">
            {{ mensajeError }}
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
